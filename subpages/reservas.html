<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="/js/script.js" defer></script>
    <script type="module" src="/js/reservas.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <title>Gerência - Reservas</title>
    <link rel="icon" type="image/x-icon" href="/img/gerente (1).png">
</head>
<body>
    <labelezza-header subtitle="Reservas"></labelezza-header>
    <div class="container-fluid">
        <main class="container">
            <h2 class="text-center my-4" style="color: var(--text-primary); font-family: 'Playfair Display', serif;">Gestão de Reservas</h2>
            
            <div class="glass-panel" style="max-width: 600px; margin: 0 auto 30px;">
                <form id="formReserva" class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label text-secondary fw-bold">Nome do Cliente</label>
                        <input type="text" id="resNome" class="form-control" required placeholder="Ex: João Silva">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-secondary fw-bold">Número da Mesa</label>
                        <input type="number" id="resMesa" class="form-control" min="1" max="25" required placeholder="1 a 25">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-secondary fw-bold">Data</label>
                        <input type="date" id="resData" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-secondary fw-bold">Horário</label>
                        <input type="time" id="resHora" class="form-control" required>
                    </div>
                    <div class="col-12 text-center mt-4">
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                            <i class="bi bi-calendar-check"></i> Salvar Reserva
                        </button>
                    </div>
                </form>
            </div>
            
            <div class="glass-panel" style="max-width: 800px; margin: 0 auto;">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Data / Hora</th>
                                <th>Cliente</th>
                                <th>Mesa</th>
                                <th class="text-end">Ação</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaReservas">
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div class="d-flex justify-content-center my-5">
                <a href="/pages/gerente.html">
                    <button class="voltar btn-secondary px-4 py-2 fw-bold shadow-sm rounded-3 text-white border-0" style="background: var(--text-secondary);">
                        <i class="bi bi-arrow-left-circle"></i> Voltar
                    </button>
                </a>
            </div>
        </main>
    </div>
    <labelezza-footer></labelezza-footer>
</body>
</html>
