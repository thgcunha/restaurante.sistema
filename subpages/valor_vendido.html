<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="/js/script.js" defer></script>
    <script type="module" src="/js/valor_vendido.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <title>Gerência - Faturamento</title>
    <link rel="icon" type="image/x-icon" href="/img/gerente (1).png">
</head>
<body>
    <labelezza-header subtitle="Métricas de Faturamento"></labelezza-header>
    <div class="container-fluid">
        <main class="container">
            <h2 class="text-center my-4" style="color: var(--text-primary); font-family: 'Playfair Display', serif;">Desempenho de Vendas</h2>
            
            <div class="row justify-content-center mb-5 g-4">
                <div class="col-md-4">
                    <div class="glass-panel text-center p-4">
                        <i class="bi bi-cash-coin fs-1 text-success mb-2"></i>
                        <h5 class="text-secondary fw-bold">Faturamento Total</h5>
                        <h3 id="faturamentoTotal" class="fw-bold text-primary">R$ 0,00</h3>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="glass-panel text-center p-4">
                        <i class="bi bi-receipt fs-1 text-info mb-2"></i>
                        <h5 class="text-secondary fw-bold">Pedidos Pagos</h5>
                        <h3 id="totalVendas" class="fw-bold text-primary">0</h3>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="glass-panel text-center p-4">
                        <i class="bi bi-graph-up fs-1 text-warning mb-2"></i>
                        <h5 class="text-secondary fw-bold">Ticket Médio</h5>
                        <h3 id="ticketMedio" class="fw-bold text-primary">R$ 0,00</h3>
                    </div>
                </div>
            </div>
            
            <div class="glass-panel" style="max-width: 800px; margin: 0 auto;">
                <h4 class="mb-4 text-secondary fw-bold border-bottom pb-2">Últimas Vendas</h4>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Data / Hora</th>
                                <th>Mesa</th>
                                <th class="text-end">Total Pago</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaVendas">
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div class="d-flex justify-content-center my-5">
                <a href="/pages/gerente.html">
                    <button class="voltar btn-secondary px-4 py-2 fw-bold shadow-sm rounded-3 text-white border-0" style="background: var(--text-secondary);">
                        <i class="bi bi-arrow-left-circle"></i> Voltar
                    </button>
                </a>
            </div>
        </main>
    </div>
    <labelezza-footer></labelezza-footer>
</body>
</html>
