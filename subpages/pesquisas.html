<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="/js/script.js" defer></script>
    <script type="module" src="/js/pesquisas.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <title>Gerência - Pesquisas e Feedbacks</title>
    <link rel="icon" type="image/x-icon" href="/img/gerente (1).png">
</head>
<body>
    <labelezza-header subtitle="Pesquisas e Avaliações"></labelezza-header>
    <div class="container-fluid">
        <main class="container">
            <h2 class="text-center my-4" style="color: var(--text-primary); font-family: 'Playfair Display', serif;">Feedback dos Clientes</h2>
            
            <div class="row mb-5 justify-content-center">
                <div class="col-md-6">
                    <div class="glass-panel text-center p-4">
                        <h4 class="text-secondary fw-bold mb-3">Nota Média de Satisfação</h4>
                        <div class="display-3 fw-bold text-warning mb-2" id="notaMedia">0.0</div>
                        <div class="fs-4 text-warning mb-2" id="estrelasMedia"></div>
                        <div class="text-muted fw-bold" id="totalAvaliacoes">Baseado em 0 avaliações</div>
                    </div>
                </div>
            </div>

            <div class="glass-panel" style="max-width: 800px; margin: 0 auto;">
                <h4 class="mb-4 text-secondary fw-bold border-bottom pb-2">Últimos Comentários</h4>
                <div id="listaFeedbacks" class="d-flex flex-column gap-3">
                    <!-- Comentarios inseridos pelo JS -->
                </div>
            </div>
            
            <div class="d-flex justify-content-center my-5">
                <a href="/pages/gerente.html">
                    <button class="voltar btn-secondary px-4 py-2 fw-bold shadow-sm rounded-3 text-white border-0" style="background: var(--text-secondary);">
                        <i class="bi bi-arrow-left-circle"></i> Voltar
                    </button>
                </a>
            </div>
        </main>
    </div>
    <labelezza-footer></labelezza-footer>
</body>
</html>
