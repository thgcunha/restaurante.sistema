<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="/js/script.js" defer></script>
    <script type="module" src="/js/contas_pendentes.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <title>Gerência - Contas Pendentes</title>
    <link rel="icon" type="image/x-icon" href="/img/gerente (1).png">
</head>
<body>
    <labelezza-header subtitle="Contas Pendentes"></labelezza-header>
    <div class="container-fluid">
        <main class="container">
            <h2 class="text-center my-4" style="color: var(--text-primary); font-family: 'Playfair Display', serif;">Pedidos Aguardando Pagamento</h2>
            
            <div class="glass-panel" style="max-width: 800px; margin: 0 auto;">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Pedido #</th>
                                <th>Mesa</th>
                                <th>Total</th>
                                <th class="text-end">Ação</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaContas">
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div class="d-flex justify-content-center my-5">
                <a href="/pages/gerente.html">
                    <button class="voltar btn-secondary px-4 py-2 fw-bold shadow-sm rounded-3 text-white border-0" style="background: var(--text-secondary);">
                        <i class="bi bi-arrow-left-circle"></i> Voltar
                    </button>
                </a>
            </div>
        </main>
    </div>
    <labelezza-footer></labelezza-footer>
</body>
</html>
